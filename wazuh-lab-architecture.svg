  <text x="790" y="175" text-anchor="middle" font-size="11" fill="#065f46">Alert &amp; event storage</text>
  <text x="790" y="192" text-anchor="middle" font-size="11" fill="#065f46">MITRE ATT&amp;CK-mapped alerts</text>

  <!-- Wazuh Dashboard -->
  <rect x="680" y="250" width="220" height="90" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
