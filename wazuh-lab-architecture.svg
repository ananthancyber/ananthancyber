  <text x="455" y="405" text-anchor="middle" font-size="10.5" fill="#52525b">FIM</text>
  <text x="455" y="420" text-anchor="middle" font-size="10.5" fill="#52525b">investigation</text>

  <rect x="525" y="380" width="130" height="80" rx="6" fill="#ffffff" stroke="#d4d4d8" stroke-width="1"/>
  <text x="590" y="405" text-anchor="middle" font-size="10.5" fill="#52525b">Custom rule</text>
  <text x="590" y="420" text-anchor="middle" font-size="10.5" fill="#52525b">development</text>

  <rect x="670" y="380" width="130" height="80" rx="6" fill="#ffffff" stroke="#d4d4d8" stroke-width="1"/>
  <text x="735" y="405" text-anchor="middle" font-size="10.5" fill="#52525b">Correlation</text>
  <text x="735" y="420" text-anchor="middle" font-size="10.5" fill="#52525b">rules</text>

  <rect x="815" y="380" width="45" height="80" rx="6" fill="#ffffff" stroke="#d4d4d8" stroke-width="1"/>
  <text x="837" y="405" text-anchor="middle" font-size="9.5" fill="#52525b">AR</text>
  <text x="837" y="420" text-anchor="middle" font-size="9.5" fill="#52525b">gap</text>

  <!-- Note on Active Response gap -->
  <rect x="330" y="555" width="600" height="45" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <text x="630" y="575" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">Known gap: Active Response manually validated but not confirmed end-to-end —</text>
  <text x="630" y="590" text-anchor="middle" font-size="11" fill="#92400e">automatic triggering currently blocked by a log-collection configuration issue</text>

  <!-- Arrows -->
  <path d="M250,170 L360,170" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M250,250 L360,220" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <text x="300" y="160" font-size="9.5" fill="#64748b">agent (TLS)</text>

  <path d="M610,190 L680,175" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M790,220 L790,250" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <path d="M485,280 L485,340" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M790,340 L790,368 L630,368" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)" stroke-dasharray="3 3"/>
</svg>
