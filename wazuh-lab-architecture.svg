  <text x="790" y="295" text-anchor="middle" font-size="11" fill="#7c2d12">Visualization &amp;</text>
  <text x="790" y="311" text-anchor="middle" font-size="11" fill="#7c2d12">investigation reports</text>

  <!-- Investigation reports output -->
