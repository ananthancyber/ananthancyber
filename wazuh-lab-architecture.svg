<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="620" fill="#ffffff"/>

  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Wazuh Blue Team Detection Lab — Architecture</text>
  <text x="480" y="54" text-anchor="middle" font-size="12" fill="#64748b">Docker Compose deployment · TLS-secured agent-manager communication</text>

  <!-- Monitored endpoints group -->
  <rect x="30" y="100" width="220" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="140" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">MONITORED ENDPOINTS</text>

  <rect x="55" y="140" width="170" height="60" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="140" y="165" text-anchor="middle" font-size="13" font-weight="600" fill="#0c4a6e">Ubuntu VM</text>
  <text x="140" y="182" text-anchor="middle" font-size="11" fill="#0c4a6e">Wazuh Agent + FIM</text>

  <rect x="55" y="220" width="170" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="140" y="245" text-anchor="middle" font-size="13" font-weight="600" fill="#7f1d1d">Kali Linux</text>
  <text x="140" y="262" text-anchor="middle" font-size="11" fill="#7f1d1d">Traffic / attack simulation</text>

  <!-- Docker Compose boundary -->
  <rect x="330" y="80" width="600" height="460" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="630" y="102" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">DOCKER COMPOSE NETWORK</text>

  <!-- Wazuh Manager -->
  <rect x="360" y="130" width="250" height="150" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="485" y="153" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81">Wazuh Manager</text>

  <rect x="375" y="165" width="220" height="30" rx="5" fill="#ffffff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="485" y="184" text-anchor="middle" font-size="11" fill="#312e81">local_rules.xml — custom &amp; correlation rules</text>

  <rect x="375" y="200" width="220" height="30" rx="5" fill="#ffffff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="485" y="219" text-anchor="middle" font-size="11" fill="#312e81">FIM engine (rules 550/553/554)</text>

  <rect x="375" y="235" width="220" height="30" rx="5" fill="#ffffff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="485" y="254" text-anchor="middle" font-size="11" fill="#312e81">Active Response module</text>

  <!-- Wazuh Indexer -->
  <rect x="680" y="130" width="220" height="90" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
